version: "3.5"

services:
  database:
    image: asr-docker-local.artifactory.umn.edu/oracle_19_19_database:1.0.0
    environment:
      ORACLE_PWD: "Oradoc_db1"
    logging:
      options:
        max-size: 50m
    volumes:
      - 'oracle_cpk:/ORCL' # persistent oracle database data.
    ports:
      - 1521:1521
      - 5500:5500
  app:
    build:
      context: .
    environment:
      DB_HOST: database
    volumes:
      - .:/usr/src/app
    depends_on:
      - database
    command: tail -f /dev/null

volumes:
  oracle_cpk: {}
